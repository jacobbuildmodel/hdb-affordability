<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 552" width="480" height="552" role="img" aria-label="The gap between near and far did not clearly change from 2020 to 2023"><style>:root{--fig-ink:#0b0b0b;--fig-ink-3:#717171;--fig-rule:#e2e1dd;--fig-surface:#fcfcfa;--fig-subject:#2873ce;--fig-context:#707379;}@media (prefers-color-scheme: dark){:root{--fig-ink:#ffffff;--fig-ink-3:#9a9a9a;--fig-rule:#38393a;--fig-surface:#1a1a19;--fig-subject:#3987e5;--fig-context:#93969c;}}:root[data-theme="dark"]{--fig-ink:#ffffff;--fig-ink-3:#9a9a9a;--fig-rule:#38393a;--fig-surface:#1a1a19;--fig-subject:#3987e5;--fig-context:#93969c;}text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}</style><rect width="480" height="552" fill="var(--fig-surface,#fcfcfa)"/><text x="16.0" y="30.0" font-size="18" fill="var(--fig-ink,#0b0b0b)" text-anchor="start" font-weight="600">The gap between near and far did not</text><text x="16.0" y="53.0" font-size="18" fill="var(--fig-ink,#0b0b0b)" text-anchor="start" font-weight="600">clearly change from 2020 to 2023</text><text x="16.0" y="78.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">Gap between a flat 5 km and one 20 km from</text><text x="16.0" y="97.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">Raffles Place, dollars per square metre,</text><text x="16.0" y="116.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">change since 2020 (top); COE premium,</text><text x="16.0" y="135.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">categories A and B (bottom)</text><line x1="48" y1="254.7" x2="456" y2="254.7" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/><polyline points="48.0,276.1 88.8,258.0 129.6,235.0 170.4,229.3 211.2,254.7 252.0,286.0 292.8,279.1 333.6,245.4 374.4,211.9 415.2,191.0 456.0,166.0" fill="none" stroke="var(--fig-subject,#2873ce)" stroke-width="2"/><polyline points="48.0,356.6 88.8,358.1 129.6,367.6 170.4,367.6 211.2,365.8 252.0,354.1 292.8,332.0 333.6,320.0 374.4,326.8 415.2,317.6 456.0,310.0" fill="none" stroke="var(--fig-context,#707379)" stroke-width="2"/><text x="48.0" y="408.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">2016</text><text x="456.0" y="408.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="end">2026</text><text x="16.0" y="430.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">How to read: when the top line rises, the</text><text x="16.0" y="449.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">price gap between near and far grew against</text><text x="16.0" y="468.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">2020. The bottom line is the COE. A</text><text x="16.0" y="487.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">description, not a test: section 7A of</text><text x="16.0" y="506.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">THESIS.md gives the calculation and its</text><text x="16.0" y="525.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">interval.</text></svg>
