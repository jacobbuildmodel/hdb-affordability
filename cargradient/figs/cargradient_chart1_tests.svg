<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 496" width="480" height="496" role="img" aria-label="No sign that COEs tilted HDB prices toward town since 2016"><style>:root{--fig-ink:#0b0b0b;--fig-ink-3:#717171;--fig-rule:#e2e1dd;--fig-surface:#fcfcfa;--fig-subject:#2873ce;--fig-context:#707379;}@media (prefers-color-scheme: dark){:root{--fig-ink:#ffffff;--fig-ink-3:#9a9a9a;--fig-rule:#38393a;--fig-surface:#1a1a19;--fig-subject:#3987e5;--fig-context:#93969c;}}:root[data-theme="dark"]{--fig-ink:#ffffff;--fig-ink-3:#9a9a9a;--fig-rule:#38393a;--fig-surface:#1a1a19;--fig-subject:#3987e5;--fig-context:#93969c;}text{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}</style><rect width="480" height="496" fill="var(--fig-surface,#fcfcfa)"/><text x="16.0" y="30.0" font-size="18" fill="var(--fig-ink,#0b0b0b)" text-anchor="start" font-weight="600">No sign that COEs tilted HDB prices</text><text x="16.0" y="53.0" font-size="18" fill="var(--fig-ink,#0b0b0b)" text-anchor="start" font-weight="600">toward town since 2016</text><text x="16.0" y="78.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">Change in the price gap between a flat 5 km</text><text x="16.0" y="97.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">and one 20 km from Raffles Place, dollars per</text><text x="16.0" y="116.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">square metre, for each $10,000 on the COE</text><line x1="329.7" y1="139.0" x2="329.7" y2="281.0" stroke="var(--fig-rule,#e2e1dd)" stroke-width="1"/><g opacity="1.0"><text x="16.0" y="166.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">T1, 2002 to 2015</text><line x1="372.8" y1="161.0" x2="434.7" y2="161.0" stroke="var(--fig-subject,#2873ce)" stroke-width="2"/><circle cx="403.7" cy="161.0" r="5" fill="var(--fig-subject,#2873ce)"/></g><g opacity="1.0"><text x="16.0" y="200.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">T2, 2016 to 2026</text><line x1="306.4" y1="195.0" x2="341.3" y2="195.0" stroke="var(--fig-subject,#2873ce)" stroke-width="2"/><circle cx="323.8" cy="195.0" r="5" fill="var(--fig-subject,#2873ce)"/></g><g opacity="0.35"><text x="16.0" y="234.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">T3 before, 2012 to 2017</text><line x1="221.3" y1="229.0" x2="257.0" y2="229.0" stroke="var(--fig-subject,#2873ce)" stroke-width="2"/><circle cx="239.2" cy="229.0" r="5" fill="var(--fig-subject,#2873ce)"/></g><g opacity="0.35"><text x="16.0" y="268.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">T3 after, 2018 to 2026</text><circle cx="289.9" cy="263.0" r="5" fill="var(--fig-subject,#2873ce)"/></g><text x="329.7" y="295.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="middle">0</text><text x="16.0" y="317.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">How to read: a dot right of zero means flats</text><text x="16.0" y="336.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">near town gained on flats far out when COEs</text><text x="16.0" y="355.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">rose; the line is the 95 per cent interval. A</text><text x="16.0" y="374.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">line that crosses zero is no clear link. T3</text><text x="16.0" y="393.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">after is T3 before plus the difference T3</text><text x="16.0" y="412.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">tests.</text><text x="16.0" y="431.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">Muted rows are not scored: a sealed gate</text><text x="16.0" y="450.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">failed (geocoding, first-stage strength, or no</text><text x="16.0" y="469.0" font-size="14" fill="var(--fig-ink-3,#717171)" text-anchor="start">tilt before 2018).</text></svg>
