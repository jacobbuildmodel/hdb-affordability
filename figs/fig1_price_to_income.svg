<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="100%" role="img" aria-label="Line chart. The price of a constant-quality four-room HDB resale flat expressed in years of median annual household income, 2013 to 2025, on an axis running from 0 to 6 years. It starts at 5.43 years in 2013, falls to a low of 4.04 in 2019, then climbs to 5.04 in 2025, ending below where it began." class="viz" preserveAspectRatio="xMidYMid meet">
<title>Years of income to buy a four-room flat</title>
<desc>The series falls for six years and then climbs, and ends below its 2013 level.</desc>

<style>
  .viz { --fig-surface:#fcfcfb; --fig-ink:#0b0b0b; --fig-ink-2:#52514e;
         --fig-rule:#e4e3df; --fig-subject:#2873ce; --fig-subject-2:#c44613; }
  @media (prefers-color-scheme: dark) {
    .viz { --fig-surface:#1a1a19; --fig-ink:#ffffff; --fig-ink-2:#c3c2b7;
           --fig-rule:#383835; --fig-subject:#3987e5; --fig-subject-2:#db602f; }
  }
  :root[data-theme="dark"] .viz { --fig-surface:#1a1a19; --fig-ink:#ffffff;
           --fig-ink-2:#c3c2b7; --fig-rule:#383835; --fig-subject:#3987e5;
           --fig-subject-2:#db602f; }
  :root[data-theme="light"] .viz { --fig-surface:#fcfcfb; --fig-ink:#0b0b0b;
           --fig-ink-2:#52514e; --fig-rule:#e4e3df; --fig-subject:#2873ce;
           --fig-subject-2:#c44613; }
  .viz text { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI,
              Roboto, Helvetica, Arial, sans-serif; }
  .ax   { font-size: 14px; fill: var(--fig-ink-2, #52514e); }
  .lbl  { font-size: 15px; font-weight: 600; }
  .note { font-size: 14px; fill: var(--fig-ink-2, #52514e); }
</style>

<rect x="0" y="0" width="480" height="340" fill="var(--fig-surface, #fcfcfb)"/>
<line x1="60.0" y1="294.0" x2="338.0" y2="294.0" stroke="var(--fig-rule, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="298.0" text-anchor="end">0</text>
<line x1="60.0" y1="254.7" x2="338.0" y2="254.7" stroke="var(--fig-rule, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="258.7" text-anchor="end">1</text>
<line x1="60.0" y1="215.3" x2="338.0" y2="215.3" stroke="var(--fig-rule, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="219.3" text-anchor="end">2</text>
<line x1="60.0" y1="176.0" x2="338.0" y2="176.0" stroke="var(--fig-rule, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="180.0" text-anchor="end">3</text>
<line x1="60.0" y1="136.7" x2="338.0" y2="136.7" stroke="var(--fig-rule, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="140.7" text-anchor="end">4</text>
<line x1="60.0" y1="97.3" x2="338.0" y2="97.3" stroke="var(--fig-rule, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="101.3" text-anchor="end">5</text>
<line x1="60.0" y1="58.0" x2="338.0" y2="58.0" stroke="var(--fig-rule, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="62.0" text-anchor="end">6</text>
<text class="ax" x="60.0" y="314.0" text-anchor="middle">2013</text>
<text class="ax" x="152.7" y="314.0" text-anchor="middle">2017</text>
<text class="ax" x="245.3" y="314.0" text-anchor="middle">2021</text>
<text class="ax" x="338.0" y="314.0" text-anchor="middle">2025</text>
<line x1="60.0" y1="80.5" x2="60.0" y2="294.0" stroke="var(--fig-ink-2, #52514e)" stroke-width="1" opacity="0.3"/>
<text class="note" x="60.0" y="70.5" text-anchor="start">2013 5.43</text>
<line x1="199.0" y1="135.0" x2="199.0" y2="294.0" stroke="var(--fig-ink-2, #52514e)" stroke-width="1" opacity="0.3"/>
<text class="note" x="199.0" y="125.0" text-anchor="middle">2019 low 4.04</text>
<path d="M 60.0 80.5 L 83.2 104.4 L 106.3 116.8 L 129.5 120.5 L 152.7 125.8 L 175.8 132.3 L 199.0 135.0 L 222.2 125.3 L 245.3 114.1 L 268.5 104.1 L 291.7 105.4 L 314.8 97.7 L 338.0 95.9" fill="none" stroke="var(--fig-subject, #2873ce)" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="338.0" cy="95.9" r="4" fill="var(--fig-subject, #2873ce)" stroke="var(--fig-surface, #fcfcfb)" stroke-width="2"/><text class="lbl" x="348.0" y="99.9" fill="var(--fig-subject, #2873ce)">5.04 years</text><text class="note" x="348.0" y="115.9">of median income</text>
</svg>
