<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="100%" role="img" aria-label="Line chart in Singapore dollars, 2019 to 2025, on one axis, for a buyer at the 20th percentile of household income. One line is the loan-to-value cap on the loan. The other is the purchase price less grants. The loan is whichever is lower. In 2019 the price less grants is lower, so grants set the loan. By 2025 the cap is lower, so the cap sets the loan and an extra dollar of grant no longer reduces it." class="viz" preserveAspectRatio="xMidYMid meet">
<title>Which constraint sets the loan</title>
<desc>The loan is the lower of the two lines. They swap over inside the window.</desc>

<style>
  .viz { --fig-surface:#fcfcfb; --fig-ink:#0b0b0b; --fig-ink-2:#52514e;
         --fig-rule:#e4e3df; --fig-subject:#2873ce; --fig-subject-2:#c44613; }
  @media (prefers-color-scheme: dark) {
    .viz { --fig-surface:#1a1a19; --fig-ink:#ffffff; --fig-ink-2:#c3c2b7;
           --fig-rule:#383835; --fig-subject:#3987e5; --fig-subject-2:#db602f; }
  }
  :root[data-theme="dark"] .viz { --fig-surface:#1a1a19; --fig-ink:#ffffff;
           --fig-ink-2:#c3c2b7; --fig-rule:#383835; --fig-subject:#3987e5;
           --fig-subject-2:#db602f; }
  :root[data-theme="light"] .viz { --fig-surface:#fcfcfb; --fig-ink:#0b0b0b;
           --fig-ink-2:#52514e; --fig-rule:#e4e3df; --fig-subject:#2873ce;
           --fig-subject-2:#c44613; }
  .viz text { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI,
              Roboto, Helvetica, Arial, sans-serif; }
  .ax   { font-size: 14px; fill: var(--fig-ink-2, #52514e); }
  .lbl  { font-size: 15px; font-weight: 600; }
  .note { font-size: 14px; fill: var(--fig-ink-2, #52514e); }
</style>

<rect x="0" y="0" width="480" height="340" fill="var(--fig-surface, #fcfcfb)"/>
<line x1="60.0" y1="294.0" x2="338.0" y2="294.0" stroke="var(--fig-rule, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="298.0" text-anchor="end">0</text>
<line x1="60.0" y1="246.8" x2="338.0" y2="246.8" stroke="var(--fig-rule, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="250.8" text-anchor="end">100k</text>
<line x1="60.0" y1="199.6" x2="338.0" y2="199.6" stroke="var(--fig-rule, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="203.6" text-anchor="end">200k</text>
<line x1="60.0" y1="152.4" x2="338.0" y2="152.4" stroke="var(--fig-rule, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="156.4" text-anchor="end">300k</text>
<line x1="60.0" y1="105.2" x2="338.0" y2="105.2" stroke="var(--fig-rule, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="109.2" text-anchor="end">400k</text>
<line x1="60.0" y1="58.0" x2="338.0" y2="58.0" stroke="var(--fig-rule, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="62.0" text-anchor="end">500k</text>
<text class="ax" x="60.0" y="314.0" text-anchor="middle">2019</text>
<text class="ax" x="245.3" y="314.0" text-anchor="middle">2023</text>
<text class="ax" x="338.0" y="314.0" text-anchor="middle">2025</text>
<path d="M 60.0 122.3 L 106.3 117.1 L 152.7 97.7 L 199.0 87.0 L 245.3 84.4 L 291.7 67.9 L 338.0 67.4" fill="none" stroke="var(--fig-subject-2, #c44613)" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M 60.0 152.7 L 106.3 149.3 L 152.7 125.4 L 199.0 100.1 L 245.3 93.3 L 291.7 72.7 L 338.0 60.3" fill="none" stroke="var(--fig-subject, #2873ce)" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="338.0" cy="82.8" r="4" fill="var(--fig-subject-2, #c44613)" stroke="var(--fig-surface, #fcfcfb)" stroke-width="2"/><text class="lbl" x="348.0" y="86.8" fill="var(--fig-subject-2, #c44613)">LTV cap</text><text class="note" x="348.0" y="102.8">480,118</text>
<circle cx="338.0" cy="44.8" r="4" fill="var(--fig-subject, #2873ce)" stroke="var(--fig-surface, #fcfcfb)" stroke-width="2"/><text class="lbl" x="348.0" y="48.8" fill="var(--fig-subject, #2873ce)">price - grants</text><text class="note" x="348.0" y="64.8">495,157</text>
<rect x="8.0" y="8.0" width="10" height="10" rx="2" fill="var(--fig-subject, #2873ce)"/>
<text class="ax" x="24.0" y="18.0">Price less grants</text>
<rect x="8.0" y="28.0" width="10" height="10" rx="2" fill="var(--fig-subject-2, #c44613)"/>
<text class="ax" x="24.0" y="38.0">Loan-to-value cap</text>
</svg>
