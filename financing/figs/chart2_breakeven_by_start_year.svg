<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="100%" role="img" aria-label="Realised break-even spread by loan start year, 2010 to 2025" class="viz" preserveAspectRatio="xMidYMid meet">
<title>Break-even spread by start year</title>
<desc>Every 2010-2015 start clears the 1.0 threshold at every reset interval; the spread falls below zero from 2023.</desc>

<style>
  .viz { --surface-1:#fcfcfb; --text-primary:#0b0b0b; --text-secondary:#52514e;
         --grid:#e4e3df; --series-1:#2a78d6; --series-2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    .viz { --surface-1:#1a1a19; --text-primary:#ffffff; --text-secondary:#c3c2b7;
           --grid:#383835; --series-1:#3987e5; --series-2:#d95926; }
  }
  :root[data-theme="dark"] .viz { --surface-1:#1a1a19; --text-primary:#ffffff;
           --text-secondary:#c3c2b7; --grid:#383835; --series-1:#3987e5;
           --series-2:#d95926; }
  :root[data-theme="light"] .viz { --surface-1:#fcfcfb; --text-primary:#0b0b0b;
           --text-secondary:#52514e; --grid:#e4e3df; --series-1:#2a78d6;
           --series-2:#eb6834; }
  .viz text { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI,
              Roboto, Helvetica, Arial, sans-serif; }
  .ax   { font-size: 14px; fill: var(--text-secondary, #52514e); }
  .lbl  { font-size: 15px; font-weight: 600; }
  .note { font-size: 14px; fill: var(--text-secondary, #52514e); }
</style>

<rect x="0" y="0" width="480" height="340" fill="var(--surface-1, #fcfcfb)"/>
<line x1="60.0" y1="241.5" x2="460.0" y2="241.5" stroke="var(--grid, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="245.5" text-anchor="end">-1</text>
<line x1="60.0" y1="184.6" x2="460.0" y2="184.6" stroke="var(--grid, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="188.6" text-anchor="end">0</text>
<line x1="60.0" y1="127.7" x2="460.0" y2="127.7" stroke="var(--grid, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="131.7" text-anchor="end">+1</text>
<line x1="60.0" y1="70.8" x2="460.0" y2="70.8" stroke="var(--grid, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="74.8" text-anchor="end">+2</text>
<text class="ax" x="60.0" y="290.0" text-anchor="middle">2010</text>
<text class="ax" x="166.7" y="290.0" text-anchor="middle">2014</text>
<text class="ax" x="273.3" y="290.0" text-anchor="middle">2018</text>
<text class="ax" x="380.0" y="290.0" text-anchor="middle">2022</text>
<text class="ax" x="460.0" y="290.0" text-anchor="middle">2025</text>
