<rect x="60.0" y="48.0" width="253.3" height="222.0" fill="var(--text-secondary, #52514e)" fill-opacity="0.06"/>
<text class="note" x="66.0" y="262.0">2010-2019: priced off SIBOR, quoted here over SORA</text>
<line x1="60.0" y1="127.7" x2="460.0" y2="127.7" stroke="var(--text-primary, #0b0b0b)" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.55"/>
<path d="M 60.0 127.7 L 60.0 48.0 L 193.3 48.0 L 193.3 127.7" fill="none" stroke="var(--text-secondary, #52514e)" stroke-width="1" stroke-dasharray="2 2" stroke-opacity="0.6"/>
<text class="note" x="64.0" y="119.7">2010-2015</text>
