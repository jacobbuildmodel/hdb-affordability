<circle cx="60.0" cy="68.1" r="3" fill="var(--series-1, #2a78d6)" fill-opacity="1.00"/>
<circle cx="86.7" cy="76.9" r="3" fill="var(--series-1, #2a78d6)" fill-opacity="1.00"/>
<circle cx="113.3" cy="74.2" r="3" fill="var(--series-1, #2a78d6)" fill-opacity="1.00"/>
<circle cx="140.0" cy="76.6" r="3" fill="var(--series-1, #2a78d6)" fill-opacity="1.00"/>
<circle cx="166.7" cy="91.2" r="3" fill="var(--series-1, #2a78d6)" fill-opacity="1.00"/>
<circle cx="193.3" cy="88.3" r="3" fill="var(--series-1, #2a78d6)" fill-opacity="1.00"/>
<circle cx="220.0" cy="91.6" r="3" fill="var(--series-1, #2a78d6)" fill-opacity="1.00"/>
<circle cx="246.7" cy="113.9" r="3" fill="var(--series-1, #2a78d6)" fill-opacity="1.00"/>
<circle cx="273.3" cy="109.1" r="3" fill="var(--series-1, #2a78d6)" fill-opacity="1.00"/>
<circle cx="300.0" cy="109.2" r="3" fill="var(--series-1, #2a78d6)" fill-opacity="1.00"/>
<circle cx="326.7" cy="152.5" r="3" fill="var(--series-1, #2a78d6)" fill-opacity="1.00"/>
<circle cx="353.3" cy="132.0" r="3" fill="var(--series-1, #2a78d6)" fill-opacity="1.00"/>
<circle cx="380.0" cy="97.9" r="3" fill="var(--series-1, #2a78d6)" fill-opacity="1.00"/>
<circle cx="406.7" cy="198.1" r="3" fill="var(--series-1, #2a78d6)" fill-opacity="1.00"/>
<circle cx="433.3" cy="244.7" r="3" fill="var(--series-1, #2a78d6)" fill-opacity="0.40"/>
<circle cx="460.0" cy="201.7" r="3" fill="var(--series-1, #2a78d6)" fill-opacity="0.40"/>
<text class="lbl" x="70.0" y="46.1" fill="var(--series-1, #2a78d6)">+2.05</text>
<text class="note" x="70.0" y="62.1">widest</text>
<text class="lbl" x="398.7" y="226.1" text-anchor="end" fill="var(--series-1, #2a78d6)">-0.24</text>
<text class="note" x="398.7" y="242.1" text-anchor="end">first below zero, every reset</text>
<rect x="60.0" y="8.0" width="10" height="10" rx="2" fill="var(--series-1, #2a78d6)"/><text class="ax" x="76.0" y="16.0">R2 realised</text>
<rect x="172.0" y="8.0" width="10" height="10" rx="2" fill="var(--series-2, #eb6834)" fill-opacity="0.14" stroke="var(--series-2, #eb6834)" stroke-width="1" stroke-dasharray="2 2"/><text class="ax" x="188.0" y="16.0">Reset range</text>
<line x1="284.0" y1="13.0" x2="296.0" y2="13.0" stroke="var(--text-primary, #0b0b0b)" stroke-width="1.2" stroke-dasharray="2 2" stroke-opacity="0.55"/><text class="ax" x="302.0" y="16.0">threshold 1.0</text>
<text class="note" x="60.0" y="316.0">Realised to 2026-07. S$400,000 over 25 years.</text>
<text class="note" x="60.0" y="332.0">2024 and 2025 dimmed: under 36 months realised.</text>
</svg>
