<text class="ax" x="52.0" y="274.0" text-anchor="end">0%</text>
<line x1="60.0" y1="220.9" x2="330.0" y2="220.9" stroke="var(--grid, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="224.9" text-anchor="end">1%</text>
<line x1="60.0" y1="171.8" x2="330.0" y2="171.8" stroke="var(--grid, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="175.8" text-anchor="end">2%</text>
<line x1="60.0" y1="122.6" x2="330.0" y2="122.6" stroke="var(--grid, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="126.6" text-anchor="end">3%</text>
<line x1="60.0" y1="73.5" x2="330.0" y2="73.5" stroke="var(--grid, #e4e3df)" stroke-width="1"/>
<text class="ax" x="52.0" y="77.5" text-anchor="end">4%</text>
<text class="ax" x="60.0" y="290.0" text-anchor="middle">2010</text>
<text class="ax" x="125.5" y="290.0" text-anchor="middle">2014</text>
<text class="ax" x="190.9" y="290.0" text-anchor="middle">2018</text>
<text class="ax" x="256.4" y="290.0" text-anchor="middle">2022</text>
<text class="ax" x="321.8" y="290.0" text-anchor="middle">2026</text>
<line x1="60.0" y1="142.3" x2="330.0" y2="142.3" stroke="var(--series-2, #eb6834)" stroke-width="2"/>
