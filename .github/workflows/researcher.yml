# Researcher: does the analysis.
# Two ways to start it:
#   1. A comment containing "@researcher" on an issue or PR.
#   2. The "Run workflow" button on the Actions tab, with the instruction typed
#      into the box (no comment needed).
name: researcher
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      instruction:
        description: "What the researcher should do"
        required: true
        type: string
      issue:
        description: "Issue number to report back on"
        required: false
        default: "4"
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: office-researcher
  cancel-in-progress: false

jobs:
  research:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '@researcher')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pdfplumber
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@researcher"
          allowed_bots: "claude[bot]"
          track_progress: ${{ github.event_name != 'workflow_dispatch' }}
          prompt: |
            You are the RESEARCHER. Read office/RESEARCHER.md and follow it exactly.
            Repository: ${{ github.repository }}.
            If this run was started by a comment, your instruction is that comment,
            in issue/PR #${{ github.event.issue.number }}.
            If it was started by the Run workflow button, your instruction is:
            ${{ github.event.inputs.instruction }}
            and you report back by posting your hand-back comment on issue
            #${{ github.event.inputs.issue }} using the gh CLI.
          claude_args: |
            --max-turns 80
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
