# Researcher: does the analysis. Wakes when a comment containing "@researcher"
# is posted on an issue or PR (by Jacob or by the checker bot).
name: researcher
on:
  issue_comment:
    types: [created]

permissions:
  contents: write        # may push to working branches (never main: see branch protection)
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: office-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  research:
    if: contains(github.event.comment.body, '@researcher')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pdfplumber
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@researcher"
          allowed_bots: "claude[bot]"
          track_progress: true
          prompt: |
            You are the RESEARCHER. Read office/RESEARCHER.md and follow it exactly.
            The instruction you must act on is the comment that mentioned you,
            in issue/PR #${{ github.event.issue.number }}.
          claude_args: |
            --max-turns 80
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep"
